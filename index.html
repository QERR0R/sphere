<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        .loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .loading-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-gif {
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
            animation: gentlePulse 2.5s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            }
            50% { 
                transform: scale(1.08); 
                filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.2));
            }
        }

        .loading-text {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 4px;
            opacity: 0.9;
            animation: fadeInOut 2s ease-in-out infinite;
            font-family: monospace;
            text-transform: uppercase;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
        }

        .video-container.visible {
            opacity: 1;
        }

        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
        }

        video::-webkit-media-controls {
            display: none !important;
        }
        
        video::-webkit-media-controls-enclosure {
            display: none !important;
        }
        
        video::-webkit-media-controls-panel {
            display: none !important;
        }
        
        video::-webkit-media-controls-play-button {
            display: none !important;
        }
        
        video::-webkit-media-controls-timeline {
            display: none !important;
        }
        
        video::-webkit-media-controls-current-time-display {
            display: none !important;
        }
        
        video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }
        
        video::-webkit-media-controls-timeline-container {
            display: none !important;
        }
        
        video::-webkit-media-controls-volume-slider-container {
            display: none !important;
        }
        
        video::-webkit-media-controls-volume-slider {
            display: none !important;
        }
        
        video::-webkit-media-controls-mute-button {
            display: none !important;
        }
        
        video::-webkit-media-controls-toggle-closed-captions-button {
            display: none !important;
        }
        
        video::-webkit-media-controls-fullscreen-button {
            display: none !important;
        }

        @media (max-width: 768px) {
            .loading-gif {
                width: 130px;
                height: 130px;
            }
            
            .loading-text {
                font-size: 1.2rem;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 480px) {
            .loading-gif {
                width: 110px;
                height: 110px;
            }
            
            .loading-text {
                font-size: 1rem;
                letter-spacing: 2px;
            }
        }

        * {
            cursor: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <img src="images/gif/rem-rezero.gif" alt="Loading" class="loading-gif">
        <div class="loading-text">PREPARING EXPERIENCE</div>
    </div>

    <div class="video-container" id="videoContainer">
        <video class="main-video" id="mainVideo">
            <source src="videos/never_gonna_give_you_up.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const loadingContainer = document.getElementById('loadingContainer');
        const videoContainer = document.getElementById('videoContainer');
        const mainVideo = document.getElementById('mainVideo');
        
        mainVideo.volume = 1.0;
        mainVideo.autoplay = true;
        mainVideo.loop = true;
        mainVideo.playsInline = true;
        mainVideo.preload = "auto";
        mainVideo.muted = false;
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        let userInteracted = false;
        let videoStarted = false;
        
        function startVideo() {
            if (videoStarted) return;
            videoStarted = true;
            
            const playPromise = mainVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    setTimeout(() => {
                        loadingContainer.classList.add('hidden');
                        videoContainer.classList.add('visible');
                    }, 300);
                }).catch(() => {
                    mainVideo.muted = true;
                    mainVideo.play().then(() => {
                        mainVideo.muted = false;
                        setTimeout(() => {
                            loadingContainer.classList.add('hidden');
                            videoContainer.classList.add('visible');
                        }, 300);
                    });
                });
            }
        }
        
        mainVideo.addEventListener('loadeddata', () => {
            setTimeout(startVideo, 500);
        });
        
        mainVideo.addEventListener('canplaythrough', () => {
            setTimeout(startVideo, 300);
        });
        
        document.addEventListener('click', () => {
            userInteracted = true;
            if (!videoStarted) startVideo();
        });
        
        document.addEventListener('touchstart', () => {
            userInteracted = true;
            if (!videoStarted) startVideo();
        });
        
        setTimeout(() => {
            if (!videoStarted) {
                startVideo();
            }
        }, 2000);
        
        mainVideo.addEventListener('error', () => {
            loadingContainer.querySelector('.loading-text').textContent = 'LOADING ERROR';
        });
    </script>
</body>
</html>
